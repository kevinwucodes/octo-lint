name: Java Linter

on:
  pull_request:

jobs:
  linterJob:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25' # Change this to match your project's Java version if needed
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Formatting Help Hint
        if: failure()
        run: |
          echo "========================================================="
          echo "❌ Style violations detected by Spotless!"
          echo "Run './gradlew spotlessApply' locally to fix automatically."
          echo "========================================================="
          exit 1